name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dataset is valid and generated modules are current
        run: npm run data:check
      - name: Server tests
        run: npm test
      - name: Frontend tests
        run: npm run test:web
      - name: API routes load under Vercel's module rules
        run: npm run check:api
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
